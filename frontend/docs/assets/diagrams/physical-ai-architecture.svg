<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Physical AI Architecture Diagram -->
  <title>Physical AI System Architecture</title>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Physical World -->
  <rect x="50" y="50" width="700" height="200" fill="#f0f8ff" stroke="#4682b4" stroke-width="2" rx="10"/>
  <text x="400" y="80" font-family="Arial" font-size="16" text-anchor="middle" fill="#000080">Physical World</text>

  <!-- Robot -->
  <rect x="100" y="120" width="120" height="80" fill="#e6f3ff" stroke="#0066cc" stroke-width="2" rx="5"/>
  <text x="160" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="#000080">Robot</text>
  <circle cx="130" cy="170" r="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="190" cy="170" r="10" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>

  <!-- Environment -->
  <ellipse cx="500" cy="160" rx="100" ry="60" fill="#f5fff0" stroke="#32cd32" stroke-width="2"/>
  <text x="500" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#228b22">Environment</text>

  <!-- Perception Layer -->
  <rect x="50" y="300" width="700" height="80" fill="#fff8f0" stroke="#ffa500" stroke-width="2" rx="10"/>
  <text x="400" y="330" font-family="Arial" font-size="16" text-anchor="middle" fill="#ff8c00">Perception Layer</text>
  <text x="400" y="355" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">Sensors, Cameras, LIDAR, IMU, Force/Torque Sensors</text>

  <!-- Cognition Layer -->
  <rect x="50" y="400" width="700" height="80" fill="#fdf0f5" stroke="#ff69b4" stroke-width="2" rx="10"/>
  <text x="400" y="430" font-family="Arial" font-size="16" text-anchor="middle" fill="#c71585">Cognition Layer</text>
  <text x="400" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">Planning, Learning, Reasoning, Decision Making</text>

  <!-- Action Layer -->
  <rect x="50" y="500" width="700" height="80" fill="#f0f8f5" stroke="#228b22" stroke-width="2" rx="10"/>
  <text x="400" y="530" font-family="Arial" font-size="16" text-anchor="middle" fill="#006400">Action Layer</text>
  <text x="400" y="555" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">Control, Actuation, Motor Commands</text>

  <!-- Arrows showing interaction -->
  <line x1="220" y1="160" x2="400" y2="160" stroke="#4682b4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="160" x2="220" y2="160" stroke="#4682b4" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="400" y1="250" x2="400" y2="300" stroke="#4682b4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="380" x2="400" y2="400" stroke="#4682b4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="480" x2="400" y2="500" stroke="#4682b4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4682b4"/>
    </marker>
  </defs>
</svg>