<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8bf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b68ee;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Robot head and body icon -->
  <g transform="translate(10, 15)">
    <!-- Robot head -->
    <rect x="5" y="0" width="20" height="20" rx="4" fill="url(#logoGradient)" />
    <!-- Eyes -->
    <circle cx="12" cy="8" r="2" fill="white" />
    <circle cx="18" cy="8" r="2" fill="white" />
    <!-- Mouth -->
    <rect x="13" y="14" width="4" height="2" rx="1" fill="white" />
    <!-- Body -->
    <rect x="8" y="22" width="14" height="18" rx="2" fill="#4f8bf9" opacity="0.8" />
    <!-- Arms -->
    <line x1="2" y1="25" x2="8" y2="25" stroke="#4f8bf9" stroke-width="2" />
    <line x1="22" y1="25" x2="28" y2="25" stroke="#4f8bf9" stroke-width="2" />
    <!-- Legs -->
    <line x1="12" y1="40" x2="12" y2="48" stroke="#4f8bf9" stroke-width="2" />
    <line x1="18" y1="40" x2="18" y2="48" stroke="#4f8bf9" stroke-width="2" />
  </g>

  <!-- Text: Physical AI & Humanoid Robotics -->
  <text x="45" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Physical AI
  </text>
  <text x="45" y="45" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
    &amp; Humanoid Robotics
  </text>
</svg>